<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Mixed circuit worked example</title><desc id="desc">A 12 volt source, a 2 ohm resistor in series, then two parallel branches containing 8 ohms each. Supply current is 2 amperes.</desc><rect width="760" height="340" fill="#f4f8fb"/><style>path,line{stroke:#284f70;stroke-width:4;fill:none}text{font:20px system-ui;fill:#193b56}.small{font-size:16px}.res{fill:#fff;stroke:#284f70;stroke-width:3}.node{fill:#284f70}</style><path d="M96 70H172 M268 70H390V195 M390 115H455 M540 115H650V266H96V172 M96 70V135 M390 195H455 M540 195H650"/><rect class="res" x="172" y="53" width="96" height="34" rx="2"/><text x="201" y="78">2 Ω</text><rect class="res" x="455" y="98" width="85" height="34" rx="2"/><text x="477" y="123">8 Ω</text><rect class="res" x="455" y="178" width="85" height="34" rx="2"/><text x="477" y="203">8 Ω</text><line x1="96" y1="135" x2="96" y2="145"/><line x1="75" y1="145" x2="117" y2="145"/><line x1="85" y1="159" x2="107" y2="159"/><line x1="96" y1="159" x2="96" y2="172"/><circle class="node" cx="390" cy="115" r="5"/><circle class="node" cx="390" cy="195" r="5"/><circle class="node" cx="650" cy="115" r="5"/><circle class="node" cx="650" cy="195" r="5"/><text x="23" y="113">12 V</text><text x="175" y="38">2 A total</text><text class="small" x="378" y="294">Each branch has the same potential difference</text></svg>
